<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DriveRack · DriveWare web port</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="js/panel.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><b>DriveRack</b> <span>web controller</span></h1>
    <div class="conn">
      <span id="link-pill" class="led pill" data-state="stopped">Disconnected</span>
      <div class="split" id="connect-group">
        <button id="btn-serial" class="primary">Connect serial…</button>
        <details class="split-menu">
          <summary aria-label="More ways to connect"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
          <div class="menu">
            <button id="btn-sim">Run simulator</button>
          </div>
        </details>
      </div>
      <button id="btn-disconnect" hidden>Disconnect</button>
      <button id="btn-panel" aria-label="Panel finish: system" title="Panel finish: system">
        <svg class="i-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <details class="options">
        <summary>Options</summary>
        <div class="options-panel">
          <fieldset>
            <legend>Serial</legend>
            <label>Baud rate
              <select id="opt-baud">
                <option>9600</option><option>19200</option><option selected>38400</option>
                <option>57600</option><option>115200</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="opt-passive"> Listen only (send nothing, just log)</label>
          </fieldset>
          <fieldset>
            <legend>Addresses if no device identifies itself</legend>
            <label>Host (this app) <input id="opt-host" value="0x00" size="5"></label>
            <label>Device <input id="opt-dev" value="0x01" size="5"></label>
          </fieldset>
          <fieldset>
            <legend>Simulator</legend>
            <label>Model <select id="opt-sim-model"></select></label>
            <label title="480, 481, 482 and 442 only: units on the simulated network (master + slaves). With more than one, a 480R remote is added too.">Network units <input id="opt-sim-units" type="number" min="1" max="8" value="1" size="3"></label>
            <label class="check"><input type="checkbox" id="opt-sim-baud" checked> Throttle to 38400 baud</label>
            <label class="check"><input type="checkbox" id="opt-sim-noise"> Line noise (1 in 400 bytes corrupted)</label>
          </fieldset>
        </div>
      </details>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="card" id="device-card"></section>
      <section class="card" id="outputs-card"></section>
      <section class="card" id="programs-card"></section>
    </aside>

    <section class="workspace">
      <div class="status-line"><span id="spinner" class="spinner" hidden></span><span id="status">Not connected.</span></div>
      <nav id="chain" class="card chain" aria-label="Signal chain"></nav>
      <section id="block-editor" class="card block-editor"></section>
    </section>
  </main>

  <section class="log-panel" id="log-panel">
    <div class="log-toolbar">
      <strong>Traffic</strong>
      <span id="log-stats" class="muted"></span>
      <span class="spacer"></span>
      <label class="check"><input type="checkbox" id="log-ctrl" checked> link bytes</label>
      <label class="check"><input type="checkbox" id="log-keepalive"> keepalives</label>
      <label class="check"><input type="checkbox" id="log-autoscroll" checked> follow</label>
      <button id="log-export">Export</button>
      <button id="log-clear">Clear</button>
    </div>
    <div class="log-body" id="log-body" role="log" aria-live="off"></div>
    <form class="raw-send" id="raw-form">
      <label>Send to <input id="raw-dst" size="5" placeholder="dev"></label>
      <label>Message <input id="raw-msg" list="msg-names" size="34" placeholder="e.g. SYSTEM_REQUEST_DEVICE_DATA or 0x1A"></label>
      <label>Data (hex) <input id="raw-data" size="28" placeholder="e.g. 00 05"></label>
      <label class="check"><input type="checkbox" id="raw-reliable" checked> reliable</label>
      <button type="submit">Send</button>
      <span id="raw-error" class="error"></span>
      <datalist id="msg-names"></datalist>
    </form>
  </section>

  <button id="btn-traffic" class="traffic-toggle" aria-controls="log-panel" aria-expanded="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h12M14 4l3 3-3 3M20 17H8M10 14l-3 3 3 3"/></svg>
    Traffic
  </button>

  <footer class="banner" id="banner">
    This software is provided “as is”, without warranty of any kind. <strong>Use it at your own risk</strong>.
    Independent project, not affiliated with Harman or dbx.
  </footer>
</body>
</html>
